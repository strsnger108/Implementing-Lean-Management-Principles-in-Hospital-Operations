name: synergy_lean_hospital
description: White-label Lean hospital operations app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  equatable: ^2.0.5
  flutter_local_notifications: ^17.2.4
  flutter_native_splash: ^2.4.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  csv: ^6.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2b6cb0"

flutter_native_splash:
  color: "#1a365d"
  image: "assets/splash.png"
  android_12:
    color: "#1a365d"
    image: "assets/splash.png"
